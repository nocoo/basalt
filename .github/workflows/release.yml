# Basalt CD
# - Tag push (v*.*.*) → deploy-tagged: strict version match
# - CI green on main   → deploy-main:    continuous deploy of latest main
# - workflow_dispatch  → deploy-tagged: manual redeploy of a specific tag
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  # ─────────────────────────────────────────────────────
  # Tagged release: enforces tag == package.json version
  # ─────────────────────────────────────────────────────
  deploy-tagged:
    name: Deploy Worker (tagged)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    environment: production
    concurrency:
      group: deploy-worker-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version and commit
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Determine tag and full ref
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            EXPECTED_REF="refs/tags/$TAG"
            # Verify input tag exists as a ref
            TAG_REF_SHA=$(git rev-parse --verify --quiet "$EXPECTED_REF" || true)
            if [ -z "$TAG_REF_SHA" ]; then
              echo "❌ Provided tag $TAG is not a valid ref (expected $EXPECTED_REF)" >&2
              exit 1
            fi
          else
            TAG="$GITHUB_REF_NAME"
            if [ "$GITHUB_REF_TYPE" != "tag" ]; then
              echo "❌ Trigger ref is not a tag: ref=$GITHUB_REF type=$GITHUB_REF_TYPE" >&2
              exit 1
            fi
            EXPECTED_REF="$GITHUB_REF"
          fi

          # Require exact vX.Y.Z format
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ Tag '$TAG' does not match required format 'vX.Y.Z'" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"

          # Verify package.json versions match
          PKG_VERSION=$(jq -r .version package.json)
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "❌ Tag $TAG does not match root package.json version $PKG_VERSION" >&2
            exit 1
          fi

          SUB_VERSION=$(jq -r .version packages/basalt/package.json)
          if [ "$SUB_VERSION" != "$VERSION" ]; then
            echo "❌ packages/basalt version $SUB_VERSION does not match root $VERSION" >&2
            exit 1
          fi

          # Resolve exact commit SHA of the tag (dereferencing annotated tag if necessary)
          TAG_COMMIT_SHA=$(git rev-parse "${EXPECTED_REF}^{commit}")
          CHECKOUT_SHA=$(git rev-parse HEAD)
          if [ "$TAG_COMMIT_SHA" != "$CHECKOUT_SHA" ]; then
            echo "❌ Tag commit $TAG_COMMIT_SHA does not match checked out commit $CHECKOUT_SHA" >&2
            exit 1
          fi
          echo "sha=$CHECKOUT_SHA" >> "$GITHUB_OUTPUT"

          # Verify that this commit exists on origin/main (fetch full main)
          git fetch origin main
          if ! git merge-base --is-ancestor "$CHECKOUT_SHA" origin/main; then
            echo "❌ Commit $CHECKOUT_SHA for tag $TAG is not on origin/main" >&2
            exit 1
          fi

          # Verify successful CI run on this exact commit:
          # Must match: head_sha == CHECKOUT_SHA, head_branch == main, event == push, status == completed, conclusion == success
          # Take the most recent matching run
          CI_CHECK=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${CHECKOUT_SHA}" \
            --jq '[.workflow_runs[] | select(.head_branch == "main" and .event == "push" and .head_sha == "'"$CHECKOUT_SHA"'")] | sort_by(.created_at) | reverse | .[0] | {id: .id, status: .status, conclusion: .conclusion}')

          if [ -z "$CI_CHECK" ] || [ "$CI_CHECK" = "null" ]; then
            echo "❌ No CI push run on main found for commit $CHECKOUT_SHA" >&2
            exit 1
          fi

          CI_STATUS=$(echo "$CI_CHECK" | jq -r .status)
          CI_CONCLUSION=$(echo "$CI_CHECK" | jq -r .conclusion)

          if [ "$CI_STATUS" != "completed" ] || [ "$CI_CONCLUSION" != "success" ]; then
            echo "❌ Latest CI run for commit $CHECKOUT_SHA is status='$CI_STATUS', conclusion='$CI_CONCLUSION' (must be completed/success)" >&2
            exit 1
          fi

          echo "CI verified successful for $CHECKOUT_SHA (run $(echo "$CI_CHECK" | jq -r .id))"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build site (into dist)
        run: bun run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Summary
        if: always()
        run: |
          {
            echo "### Basalt Release ${{ steps.ver.outputs.tag }}"
            echo ""
            echo "- Trigger: tagged (\`${{ github.event_name }}\`)"
            echo "- Worker: deployed to \`theme-basalt\` (production)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ─────────────────────────────────────────────────────
  # Continuous deploy: main push, gated by CI success
  # ─────────────────────────────────────────────────────
  deploy-main:
    name: Deploy Worker (main)
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-worker-production
      cancel-in-progress: false
    steps:
      - name: Checkout main HEAD that CI validated
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read package.json version
        id: ver
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build site (into dist)
        run: bun run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Summary
        if: always()
        run: |
          {
            echo "### Basalt Continuous Deploy"
            echo ""
            echo "- Trigger: main push (CI gated)"
            echo "- SHA: \`${{ steps.ver.outputs.sha }}\`"
            echo "- Version: \`${{ steps.ver.outputs.version }}\`"
            echo "- Worker: \`theme-basalt\`"
          } >> "$GITHUB_STEP_SUMMARY"
