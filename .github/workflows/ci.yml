# System0 native mode: this workflow only calls the repository's own slot
# workflow, so checks render as `quality / <ID>: <Name>` and
# `quality / Z1: Gate` is the single required check.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  actions: read

jobs:
  quality:
    uses: ./.github/workflows/quality-slots.yml
