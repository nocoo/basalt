name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae # main 2026-10-22
    with:
      runtime-version: "1.4.0"
      install-policy: "trusted"
      coverage-path: "coverage"
      prepare-command: "bun run --cwd packages/basalt build && bun run build"
      test-command: "bun run test:coverage"
      typecheck-command: "bun run typecheck"

  l1-precommit-self-test:
    name: L1 pre-commit self-test
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae # main 2026-10-22
    with:
      runtime-version: "1.4.0"
      install-policy: "trusted"
      timeout-minutes: 60
      pre-command: |
        mkdir -p .ci-bin
        curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz -C .ci-bin gitleaks
        chmod +x .ci-bin/gitleaks
        bun run --cwd packages/basalt build
      command: "PATH=$GITHUB_WORKSPACE/.ci-bin:$PATH bun run test:l1-gate -- --probes-only"

  package-gates:
    name: Package Gates & Consumers
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ac635753a869cb85fad1f52aae4ccbd6119f3cae # main 2026-10-22
    with:
      runtime-version: "1.4.0"
      node-version: "24.22.1"
      install-policy: "trusted"
      browser: "chromium"
      timeout-minutes: 30
      pre-command: "bun run --cwd packages/basalt build"
      command: |
        bun run --cwd packages/basalt types:check
        bun run --cwd packages/basalt pack:check
        bun run --cwd packages/basalt publint
        bun run consumer:tailwind
        bun run consumer:standalone
        bun run consumer:next
        bun run consumer:heavy
        bun run consumer:docs
        bun run test:showcase
        bunx --no-install playwright install --with-deps webkit
        bun run test:layouts
