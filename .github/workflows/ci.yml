# CI slot standard v1 (nocoo/base-ci docs/slots.md): impl S1, S2, S3, G1, G2, B1, L1, L3, P1, Z1 via quality.yml;
# na L1.5, L2 in slot-status. nocoo/base-ci v2026.12: top-level slot jobs, L3 browsers/artifacts.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      runtime-version: "1.4.0"
      node-version: "26.12.1"
      install-policy: trusted
      coverage-path: coverage
      typecheck-command: bun run typecheck
      prepare-command: bun run --cwd packages/basalt build
      test-command: bun run test:coverage
      osv-config: osv-scanner.toml
      gitleaks-config: .gitleaks.toml
      build: true
      build-command: bun run --cwd packages/basalt build && bun run build
      workflow-lint: true
      workflow-lint-required-workflow: nocoo/base-ci/.github/workflows/deploy-worker.yml
      workflow-lint-yamllint: true
      package-check: true
      package-command: |
        bun run --cwd packages/basalt types:check
        bun run --cwd packages/basalt pack:check
        bun run --cwd packages/basalt publint
      l3: true
      l3-browsers: "chromium webkit"
      l3-prepare-command: bun run --cwd packages/basalt build && bun run build
      l3-command: |
        bun run consumer:next
        bun run test:showcase
        bun run test:layouts
      env-json: '{"WRANGLER_SEND_METRICS": "false", "CI": "true"}'
      slot-status: >-
        {"S1": {"status": "impl"},
        "S2": {"status": "impl"},
        "S3": {"status": "impl"},
        "G1": {"status": "impl"},
        "G2": {"status": "impl"},
        "B1": {"status": "impl"},
        "L1": {"status": "impl"},
        "L1.5": {"status": "na", "reason": "无 @cloudflare/vitest-pool-workers / miniflare Worker 运行时测试套件；Worker 路由由 L1 vitest 模拟 ASSETS"},
        "L2": {"status": "na", "reason": "无独立 test:api；HTTP/SSR 断言已编入 L3 consumer 门（Playwright 驱动本地 HTTP 服务）"},
        "L3": {"status": "impl"},
        "P1": {"status": "impl"},
        "Z1": {"status": "impl"}}

  l3-consumer-gates:
    name: L3 consumer gates (extended)
    uses: nocoo/base-ci/.github/workflows/test-job.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      runtime-version: "1.4.0"
      node-version: "26.12.1"
      install-policy: trusted
      browser: chromium
      timeout-minutes: 30
      pre-command: "bun run --cwd packages/basalt build"
      command: |
        bun run consumer:tailwind
        bun run consumer:standalone
        bun run consumer:heavy
        bun run consumer:docs

  l1-precommit-self-test:
    name: L1 pre-commit self-test
    uses: nocoo/base-ci/.github/workflows/test-job.yml@1ea10ecab22b72512399485391603fe03a161016 # v2026.12
    with:
      runtime-version: "1.4.0"
      install-policy: trusted
      timeout-minutes: 60
      pre-command: |
        mkdir -p .ci-bin
        curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz -C .ci-bin gitleaks
        chmod +x .ci-bin/gitleaks
        bun run --cwd packages/basalt build
      command: "PATH=$GITHUB_WORKSPACE/.ci-bin:$PATH bun scripts/l1-gate-self-test.ts --probes-only"
