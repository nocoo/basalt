      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: basalt-package-dist
          path: packages/basalt/dist
      - name: Coverage shard 7/8
        run: bun run test:coverage:shard -- --shard=7/8 --coverage.reportsDirectory="$RUNNER_TEMP/coverage-shard-7"
      - name: Upload coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-shard-7
          path: ${{ runner.temp }}/coverage-shard-7
          if-no-files-found: error
          retention-days: 1
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  unit-shard-8:
    name: "L1: Unit (Shard 8/8)"
    needs: b1-build-package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@e5876a604547b1ddb0916f16dd841a4f832609a0 # v2026.20
        with:
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: basalt-package-dist
          path: packages/basalt/dist
      - name: Coverage shard 8/8
        run: bun run test:coverage:shard -- --shard=8/8 --coverage.reportsDirectory="$RUNNER_TEMP/coverage-shard-8"
      - name: Upload coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
