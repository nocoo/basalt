        run: |
          set -euo pipefail
          bun run scripts/merge-coverage.ts \
            --input="$RUNNER_TEMP/coverage-shards/coverage-shard-1,$RUNNER_TEMP/coverage-shards/coverage-shard-2,$RUNNER_TEMP/coverage-shards/coverage-shard-3,$RUNNER_TEMP/coverage-shards/coverage-shard-4,$RUNNER_TEMP/coverage-shards/coverage-shard-5,$RUNNER_TEMP/coverage-shards/coverage-shard-6,$RUNNER_TEMP/coverage-shards/coverage-shard-7,$RUNNER_TEMP/coverage-shards/coverage-shard-8" \
