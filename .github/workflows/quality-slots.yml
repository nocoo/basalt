# System0 quality slots, native mode (system0-quality v1.3.0, base-ci v2026.15).
#
# Every slot is a top-level job named exactly "<ID>: <Name>", so the caller
# (ci.yml job `quality`) renders `quality / S1: Types` ... `quality / Z1: Gate`.
# Steps are inlined; base-ci composite actions are pinned by full SHA.
#
# L2 Runtime and L3 Integration are declared na in AGENTS.md and stay skipped.
# `consumer-next`, `hook-self-test` and `cross-browser-layouts` are outside the
# 12 slots; the first two block and are aggregated by Z1, the cross-browser matrix
# is non-blocking nightly coverage.
name: Quality slots

on:
  workflow_call:

permissions:
  contents: read
  actions: read

env:
  BUN_VERSION: "1.4.0"
  NODE_VERSION: "26.12.1"
  NO_COLOR: "1"
  SLOT_STATUS: >-
    {"S1": {"status": "impl"},
    "S2": {"status": "impl"},
    "S3": {"status": "impl"},
    "G1": {"status": "impl"},
    "G2": {"status": "impl"},
    "B1": {"status": "impl"},
    "L1": {"status": "impl"},
    "L2": {"status": "na", "reason": "worker tests run in Node with a mocked ASSETS binding (L1 evidence); no workerd or vitest-pool-workers suite exists"},
    "L3": {"status": "na", "reason": "static Vite catalog plus static-asset Worker; no service, protocol or storage boundary to integrate"},
    "L4": {"status": "impl"},
    "P1": {"status": "impl"},
    "Z1": {"status": "impl"}}

jobs:
  s1-types:
    name: "S1: Types"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0 # v2026.15
        with:
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - name: Typecheck catalog and package lanes
        run: bun run typecheck
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s2-lint:
    name: "S2: Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0 # v2026.15
        with:
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - name: Biome check-only (0 error / 0 warning)
        run: bun run lint
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  s3-workflow:
    name: "S3: Workflow"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified actionlint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: actionlint and immutable references
        run: bun run scripts/quality/workflow-lint.ts
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g1-secrets:
    name: "G1: Secrets"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: nocoo/base-ci/.github/actions/setup-security-scanners@777bbe4f9bacab8a91d8c01974480a6ee23d28e0 # v2026.15
      - name: Gitleaks over the checked-out content
        run: |
          set -euo pipefail
          gitleaks dir . --no-banner --redact --config=.gitleaks.toml --gitleaks-ignore-path=.
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  g2-dependencies:
    name: "G2: Dependencies"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-security-scanners@777bbe4f9bacab8a91d8c01974480a6ee23d28e0 # v2026.15
      - name: OSV scan bun.lock
        run: |
          set -euo pipefail
          test -f bun.lock || { echo "::error::missing bun.lock"; exit 1; }
          osv-scanner scan --lockfile=bun.lock --config=osv-scanner.toml
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  b1-build:
    name: "B1: Build"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0 # v2026.15
        with:
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - name: Build package and site
        run: |
          set -euo pipefail
          bun run --cwd packages/basalt build
          bun run build
        env:
          CI: "true"
      - name: Upload package build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: basalt-package-dist
          path: packages/basalt/dist
          if-no-files-found: error
          retention-days: 1
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  unit-shard-1:
    name: "Unit shard 1/4"
    needs: b1-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0 # v2026.15
        with:
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: basalt-package-dist
          path: packages/basalt/dist
      - name: Coverage shard 1/4
        run: bun run test:coverage:shard -- --shard=1/4 --coverage.reportsDirectory="$RUNNER_TEMP/coverage-shard-1"
      - name: Upload coverage shard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-shard-1
          path: ${{ runner.temp }}/coverage-shard-1
          if-no-files-found: error
          retention-days: 1
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  unit-shard-2:
    name: "Unit shard 2/4"
    needs: b1-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0 # v2026.15
        with:
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: basalt-package-dist
          path: packages/basalt/dist
      - name: Coverage shard 2/4
        run: bun run test:coverage:shard -- --shard=2/4 --coverage.reportsDirectory="$RUNNER_TEMP/coverage-shard-2"
      - name: Upload coverage shard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-shard-2
          path: ${{ runner.temp }}/coverage-shard-2
          if-no-files-found: error
          retention-days: 1
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  unit-shard-3:
    name: "Unit shard 3/4"
    needs: b1-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0 # v2026.15
        with:
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: basalt-package-dist
          path: packages/basalt/dist
      - name: Coverage shard 3/4
        run: bun run test:coverage:shard -- --shard=3/4 --coverage.reportsDirectory="$RUNNER_TEMP/coverage-shard-3"
      - name: Upload coverage shard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-shard-3
          path: ${{ runner.temp }}/coverage-shard-3
          if-no-files-found: error
          retention-days: 1
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  unit-shard-4:
    name: "Unit shard 4/4"
    needs: b1-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0 # v2026.15
        with:
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: basalt-package-dist
          path: packages/basalt/dist
      - name: Coverage shard 4/4
        run: bun run test:coverage:shard -- --shard=4/4 --coverage.reportsDirectory="$RUNNER_TEMP/coverage-shard-4"
      - name: Upload coverage shard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-shard-4
          path: ${{ runner.temp }}/coverage-shard-4
          if-no-files-found: error
          retention-days: 1
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-unit:
    name: "L1: Unit"
    needs:
      - unit-shard-1
      - unit-shard-2
      - unit-shard-3
      - unit-shard-4
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0 # v2026.15
        with:
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: coverage-shard-*
          path: ${{ runner.temp }}/coverage-shards
      - name: Reject focused and skipped tests
        run: bun run scripts/quality/test-focus-guard.ts
      - name: Merge coverage shards
        run: |
          set -euo pipefail
          bun run scripts/merge-coverage.ts \
            --input="$RUNNER_TEMP/coverage-shards/coverage-shard-1,$RUNNER_TEMP/coverage-shards/coverage-shard-2,$RUNNER_TEMP/coverage-shards/coverage-shard-3,$RUNNER_TEMP/coverage-shards/coverage-shard-4" \
            --output=coverage
      - name: Verify coverage reports
        run: bun run scripts/verify-pre-commit-coverage.ts
      - name: Upload L1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: l1-unit-results
          path: coverage/
          if-no-files-found: warn
          retention-days: 7
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l2-runtime:
    name: "L2: Runtime"
    if: ${{ vars.ENABLE_L2_RUNTIME == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Declared na
        run: echo "L2 Runtime is declared na"

  l3-integration:
    name: "L3: Integration"
    if: ${{ vars.ENABLE_L3_INTEGRATION == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Declared na
        run: echo "L3 Integration is declared na"

  l4-e2e:
    name: "L4: E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0 # v2026.15
        with:
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Design contract
        run: bun run design:check
      - name: Showcase journeys
        run: |
          set -euo pipefail
          mkdir -p test-results
          if ! bun run test:showcase:smoke > "$RUNNER_TEMP/l4.log" 2>&1; then
            tail -200 "$RUNNER_TEMP/l4.log"
            exit 1
          fi
          tail -30 "$RUNNER_TEMP/l4.log"
      - name: Assert showcase gate ran
        run: |
          set -euo pipefail
          perl -pe 's/\e\[[0-9;]*[A-Za-z]//g' "$RUNNER_TEMP/l4.log" | grep -Eq 'Showcase smoke passed'
      - name: Upload L4 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: l4-e2e-results
          path: |
            test-results/
            ${{ runner.temp }}/l4.log
          if-no-files-found: warn
          retention-days: 7
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  p1-package:
    name: "P1: Package"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0 # v2026.15
        with:
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - name: Build the publishable package
        run: bun run --cwd packages/basalt build
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Type declarations, pack contents and publint
        run: |
          set -euo pipefail
          bun run --cwd packages/basalt types:check
          bun run --cwd packages/basalt pack:check
          bun run --cwd packages/basalt publint
      - name: Standalone and Tailwind consumers
        run: |
          set -euo pipefail
          BASALT_SKIP_PACKAGE_BUILD=1 bun run consumer:standalone
          BASALT_SKIP_PACKAGE_BUILD=1 bun run consumer:tailwind
      - name: Heavy peers and granular exports
        run: BASALT_SKIP_PACKAGE_BUILD=1 bun run consumer:heavy
      - name: Documentation consumer from the tarball
        run: bun run consumer:docs
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  consumer-next:
    name: "Next.js consumer"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0 # v2026.15
        with:
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Next.js install, SSR, hydration and real HTTP
        run: |
          set -euo pipefail
          if ! bun run consumer:next > "$RUNNER_TEMP/next.log" 2>&1; then
            tail -200 "$RUNNER_TEMP/next.log"
            exit 1
          fi
          tail -40 "$RUNNER_TEMP/next.log"
      - name: Upload Next consumer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: consumer-next-results
          path: |
            test-results/
            ${{ runner.temp }}/next.log
          if-no-files-found: warn
          retention-days: 7
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  hook-self-test:
    name: "Hook self-test"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0 # v2026.15
        with:
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - uses: nocoo/base-ci/.github/actions/setup-security-scanners@777bbe4f9bacab8a91d8c01974480a6ee23d28e0 # v2026.15
      - name: Install verified actionlint
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Package build for hook fixtures
        run: bun run --cwd packages/basalt build
      - name: Negative probes for slots, secrets, OID snapshots, tools, drift and timeouts
        run: bun run test:gate-self-test
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  cross-browser-layouts:
    name: "Cross-browser layouts (nightly)"
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0 # v2026.15
        with:
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - name: Install Chromium and WebKit
        run: bunx playwright install --with-deps chromium webkit
      - name: Mobile layouts in both engines
        run: bun run test:layouts

  full-showcase:
    name: "Full showcase sweep (nightly)"
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/setup-js@777bbe4f9bacab8a91d8c01974480a6ee23d28e0 # v2026.15
        with:
          runtime-version: ${{ env.BUN_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Full showcase gate
        run: bun run test:showcase

  z1-gate:
    name: "Z1: Gate"
    if: always()
    outputs:
      tested-sha: ${{ steps.gate.outputs.tested-sha }}
    needs:
      - s1-types
      - s2-lint
      - s3-workflow
      - g1-secrets
      - g2-dependencies
      - b1-build
      - unit-shard-1
      - unit-shard-2
      - unit-shard-3
      - unit-shard-4
      - l1-unit
      - l2-runtime
      - l3-integration
      - l4-e2e
      - p1-package
      - consumer-next
      - hook-self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify slot declarations, results and tested SHA
        id: gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EXPECTED_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/quality/z1-gate.py
