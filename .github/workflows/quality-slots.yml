          package-manager: bun
          browsers: chromium
          install-deps: "auto"
          cache: "true"
      - name: Design contract
        run: bun run design:check
      - name: Browser helper tests
        run: bun run test:browser
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l4-e2e-showcase-1:
