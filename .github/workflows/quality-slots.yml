          retention-days: 1
      - name: Record tested SHA
        id: record-sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  l1-unit:
    name: "L1: Unit"
    needs:
      - unit-shard-1
      - unit-shard-2
      - unit-shard-3
      - unit-shard-4
      - unit-shard-5
      - unit-shard-6
      - unit-shard-7
      - unit-shard-8
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tested-sha: ${{ steps.record-sha.outputs.sha }}
