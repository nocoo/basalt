          path: packages/basalt/dist
      - name: Coverage shard 6/8
        run: bun run test:coverage:shard -- --shard=6/8 --coverage.reportsDirectory="$RUNNER_TEMP/coverage-shard-6"
      - name: Upload coverage shard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
