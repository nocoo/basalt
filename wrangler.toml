name = "theme-basalt"
routes = [
  { pattern = "basaltui.com", custom_domain = true },
  { pattern = "www.basaltui.com", custom_domain = true }
]
workers_dev = false
preview_urls = false
main = "worker/index.ts"
compatibility_date = "2026-03-08"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
run_worker_first = true
