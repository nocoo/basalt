<!doctype html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow" />
		<meta name="color-scheme" content="dark light" />
		<title>Ambient loading — Basalt</title>
		<style>
			:root {
				--background: 0 0% 9%;
				--foreground: 220 12% 75%;
				--glow-blue: 215 60% 52%;
				--glow-teal: 179 35% 42%;
				--glow-violet: 245 40% 47%;
				--glow-opacity: 0.22;
				--particles: 132 164 199;
				--particles-back: 116 170 163;
				--motion-state: running;
				--transition: 500ms;
				color-scheme: dark;
			}
			:root[data-theme="light"] {
				--background: 220 14% 94%;
				--foreground: 220 14% 33%;
				--glow-blue: 209 58% 71%;
				--glow-teal: 164 35% 72%;
				--glow-violet: 245 45% 80%;
				--glow-opacity: 0.3;
				--particles: 77 107 139;
				--particles-back: 91 134 130;
				color-scheme: light;
			}
			:root[data-paused="true"] { --motion-state: paused; }
			* { box-sizing: border-box; }
			body { margin: 0; background: hsl(var(--background)); color: hsl(var(--foreground)); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
			.loading-screen { position: relative; width: 100%; height: 100svh; overflow: hidden; isolation: isolate; background: hsl(var(--background)); transition: background var(--transition); }
			.light-field { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
			.glow { position: absolute; width: 110vmax; height: 100vmax; border-radius: 50%; opacity: var(--glow-opacity); will-change: transform; animation-duration: 16s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-direction: alternate; animation-play-state: var(--motion-state); }
			.glow-blue { left: -48vmax; top: -52vmax; background: radial-gradient(ellipse, hsl(var(--glow-blue)) 0, transparent 65%); animation-name: blue-drift; }
			.glow-teal { right: -55vmax; bottom: -58vmax; background: radial-gradient(ellipse, hsl(var(--glow-teal)) 0, transparent 65%); animation-name: teal-drift; animation-duration: 19s; animation-delay: -8s; }
			.glow-violet { left: -6vmax; bottom: -67vmax; background: radial-gradient(ellipse, hsl(var(--glow-violet)) 0, transparent 64%); animation-name: violet-drift; animation-duration: 21s; animation-delay: -11s; }
			canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mask-image: radial-gradient(ellipse 180px 100px at 50% 50%, transparent, #000 150%); }
			.status { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; gap: 3px; font-size: 13px; font-weight: 400; letter-spacing: 0.07em; color: hsl(var(--foreground) / 0.82); user-select: none; }
			.dots { display: inline-flex; width: 15px; gap: 2px; align-items: center; padding-top: 7px; }
			.dots i { display: block; width: 2px; height: 2px; border-radius: 50%; background: currentColor; animation: dot-breathe 1.8s ease-in-out infinite; animation-play-state: var(--motion-state); }
			.dots i:nth-child(2) { animation-delay: 180ms; }
			.dots i:nth-child(3) { animation-delay: 360ms; }
			.theme-toggle { position: absolute; z-index: 2; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 50%; padding: 0; background: transparent; color: hsl(var(--foreground)); opacity: 0.3; cursor: pointer; touch-action: manipulation; transition: opacity 180ms, background 180ms; }
			.theme-toggle:hover { opacity: 0.8; background: hsl(var(--foreground) / 0.05); }
			.theme-toggle:focus-visible { opacity: 0.9; outline: 1px solid currentColor; outline-offset: -7px; }
			.theme-toggle svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.2; }
			@keyframes blue-drift { from { transform: translate(-4vmax, 4vmax) scale(0.92); } to { transform: translate(22vmax, 18vmax) scale(1.08); } }
			@keyframes teal-drift { from { transform: translate(4vmax, 5vmax) scale(1.08); } to { transform: translate(-20vmax, -16vmax) scale(0.9); } }
			@keyframes violet-drift { from { transform: translate(-15vmax, 8vmax); } to { transform: translate(20vmax, -12vmax); } }
			@keyframes dot-breathe { 0%, 75%, 100% { opacity: 0.2; } 35% { opacity: 0.9; } }
			@media (max-width: 600px) {
				canvas { mask-image: radial-gradient(ellipse 105px 70px at 50% 50%, transparent, #000 170%); }
				.status { font-size: 12px; }
				.glow-blue { top: -40vmax; left: -60vmax; }
				.glow-teal { right: -65vmax; bottom: -40vmax; }
			}
			@media (prefers-reduced-motion: reduce) {
				:root { --transition: 0ms; }
				.glow, .dots i { animation: none; }
				.theme-toggle { transition: none; }
				.dots i { opacity: 0.6; }
			}
		</style>
	</head>
	<body>
		<main class="loading-screen" aria-label="Loading screen">
			<div class="light-field" aria-hidden="true"><div class="glow glow-blue"></div><div class="glow glow-teal"></div><div class="glow glow-violet"></div></div>
			<canvas aria-hidden="true"></canvas>
			<div class="status" role="status" aria-label="Loading"><span aria-hidden="true">Loading</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></div>
			<button type="button" class="theme-toggle" aria-label="Switch to light theme" title="Switch theme (T)"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.5" /><path d="M10 1v2m0 14v2M1 10h2m14 0h2M3.6 3.6 5 5m10 10 1.4 1.4M3.6 16.4 5 15M15 5l1.4-1.4" /></svg></button>
		</main>
		<script>
			const root = document.documentElement;
			const screen = document.querySelector(".loading-screen");
			const canvas = document.querySelector("canvas");
			const context = canvas.getContext("2d");
			const themeButton = document.querySelector(".theme-toggle");
			const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
			let paused = false;
			let frame = 0;
			let lastFrame = 0;
			let elapsed = 0;
			let width = 0;
			let height = 0;
			let colors = [];
			function updateColors() {
				const style = getComputedStyle(root);
				colors = [style.getPropertyValue("--particles").trim(), style.getPropertyValue("--particles-back").trim()];
			}
			function draw() {
				context.clearRect(0, 0, width, height);
				const mobile = width <= 600;
				const rows = mobile ? 25 : 35;
				const columns = mobile ? 40 : 72;
				const time = elapsed / 1000;
				for (let layer = 1; layer >= 0; layer--) {
					for (let row = 0; row < rows; row++) {
						const v = row / (rows - 1);
						const depth = Math.sin(v * Math.PI);
						const alpha = layer ? 0.04 + depth * 0.1 : 0.09 + depth * 0.34;
						const radius = layer ? 0.65 : 0.55 + depth * (mobile ? 0.85 : 0.75);
						context.fillStyle = `rgb(${colors[layer]} / ${alpha})`;
						context.beginPath();
						for (let column = 0; column < columns; column++) {
							const u = column / (columns - 1);
							const phase = time * 0.52 + layer * 2.5;
							const sway = Math.sin(v * 5 + phase * 0.65) * width * 0.055;
							const x = (u * 1.34 - 0.17) * width + sway;
							const wave = Math.sin(u * 6.5 - v * 3.8 + phase) * 0.11 + Math.cos(u * 3.8 + v * 5.4 - phase * 0.7) * 0.045;
							const y = (v * 1.55 - 0.28 + wave + layer * 0.055) * height;
							context.moveTo(x + radius, y);
							context.arc(x, y, radius, 0, Math.PI * 2);
						}
						context.fill();
					}
				}
			}
			function animate(time) {
				if (lastFrame) elapsed += Math.min(time - lastFrame, 64);
				lastFrame = time;
				draw();
				frame = requestAnimationFrame(animate);
			}
			function syncMotion() {
				cancelAnimationFrame(frame);
				lastFrame = 0;
				root.dataset.paused = String(paused || document.hidden);
				draw();
				if (!paused && !document.hidden && !reducedMotion.matches) frame = requestAnimationFrame(animate);
			}
			function resize() {
				const rect = screen.getBoundingClientRect();
				width = rect.width;
				height = rect.height;
				const ratio = Math.min(devicePixelRatio || 1, 2);
				canvas.width = Math.round(width * ratio);
				canvas.height = Math.round(height * ratio);
				context.setTransform(ratio, 0, 0, ratio, 0, 0);
				draw();
			}
			function toggleTheme() {
				const light = root.dataset.theme !== "light";
				root.dataset.theme = light ? "light" : "dark";
				themeButton.setAttribute("aria-label", `Switch to ${light ? "dark" : "light"} theme`);
				updateColors();
				draw();
			}
			themeButton.addEventListener("click", toggleTheme);
			document.addEventListener("keydown", (event) => {
				if (event.ctrlKey || event.altKey || event.metaKey || event.shiftKey || event.target.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(event.target.tagName)) return;
				if (event.key.toLowerCase() === "t") toggleTheme();
				if (event.code === "Space" && event.target.tagName !== "BUTTON") {
					event.preventDefault();
					paused = !paused;
					syncMotion();
				}
			});
			window.addEventListener("resize", resize);
			document.addEventListener("visibilitychange", syncMotion);
			reducedMotion.addEventListener("change", syncMotion);
			updateColors();
			resize();
			syncMotion();
		</script>
	</body>
</html>
