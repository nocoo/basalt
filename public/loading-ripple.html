		<style>

			:root[data-paused="true"] { --motion: paused; }
			* { box-sizing: border-box; }
			body { margin: 0; background: hsl(var(--background)); color: hsl(var(--foreground)); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
			.stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; background: hsl(var(--background)); }
			canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; mask-image: radial-gradient(circle at center, transparent 85px, #000 220px); }
			.loader { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; }
			.mark { position: relative; display: block; width: var(--mark-size); height: var(--mark-size); object-fit: contain; }
			.wave { position: relative; display: flex; align-items: center; gap: 3px; height: 18px; }
			.wave::before { position: absolute; top: 50%; left: -7px; right: -7px; height: 1px; content: ""; background: hsl(var(--ripple) / 0.1); }
			.wave i { display: block; width: 3px; height: 18px; border-radius: 3px; background: hsl(var(--ripple)); transform: scaleY(0.18); animation: wave 1.8s ease-in-out infinite; animation-delay: calc(var(--i) * -90ms); animation-play-state: var(--motion); }
			.controls { position: fixed; z-index: 1; bottom: max(12px, env(safe-area-inset-bottom)); left: 50%; display: flex; align-items: center; transform: translateX(-50%); opacity: 0.4; }
			.controls:hover, .controls:focus-within { opacity: 0.85; }
			button { position: relative; display: grid; place-items: center; min-width: 44px; height: 44px; padding: 0 10px; border: 0; background: transparent; color: inherit; font: inherit; font-size: 12px; cursor: pointer; touch-action: manipulation; white-space: nowrap; }
			button:focus-visible { outline: 1px solid currentColor; outline-offset: -4px; border-radius: 8px; }
			button[data-brand][aria-pressed="true"]::after { position: absolute; bottom: 5px; width: 3px; height: 3px; content: ""; border-radius: 50%; background: currentColor; }
			.theme { margin-left: 12px; }
			.theme svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.3; }
			@keyframes wave { 0%, 65%, 100% { transform: scaleY(0.18); opacity: 0.4; } 32% { transform: scaleY(1); opacity: 1; } }
			@media (max-width: 600px) { canvas { mask-image: radial-gradient(circle at center, transparent 80px, #000 160px); } }

			const root = document.documentElement;
			const logo = document.querySelector(".logo");
			const brandButtons = [...document.querySelectorAll("[data-brand]")];
			const themeButton = document.querySelector(".theme");
			const canvas = document.querySelector("canvas");
			const ctx = canvas.getContext("2d");
			const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
			let brand = "basalt";
			let width = 0;
			let height = 0;
			let frame = 0;
			let elapsed = 0;
			let lastTime = 0;
			let paused = false;
			let ink = "";
			function render() {
				const asset = assets[brand];
				logo.alt = asset.name;
				logo.srcset = Object.entries(asset.hd).map(([size, source]) => `${source} ${size}w`).join(", ");
				logo.src = asset.hd[96];
				brandButtons.forEach((button) => {
					button.setAttribute("aria-pressed", String(button.dataset.brand === brand));
				});
				document.title = `${asset.name} · 48px HD — Pulse loading`;
			}
			function draw() {
				ctx.clearRect(0, 0, width, height);
				const time = elapsed / 1000;
				const rows = Math.ceil(height / 28) + 8;
				const columns = Math.ceil(width / (width < 600 ? 22 : 28)) + 4;
				for (let row = 0; row < rows; row++) {
					const v = row / (rows - 1);
					const alpha = 0.014 + Math.sin(v * Math.PI) * 0.03;
					ctx.fillStyle = `hsl(${ink} / ${alpha})`;
					ctx.beginPath();
					for (let column = 0; column < columns; column++) {
						const u = column / (columns - 1);
						const wave = Math.sin(u * 7.5 - v * 4 + time * 0.7) * 0.065 + Math.cos(u * 4 + v * 5 - time * 0.45) * 0.025;
						const x = (u * 1.12 - 0.06) * width;
						const y = (v * 1.35 - 0.175 + wave) * height;
						if (x < -2 || x > width + 2 || y < -2 || y > height + 2) continue;
						ctx.moveTo(x + 0.8, y);
						ctx.arc(x, y, 0.8, 0, Math.PI * 2);
					}
					ctx.fill();
				}
			}
			function animate(time) {
				if (lastTime) elapsed += Math.min(time - lastTime, 64);
				lastTime = time;
				draw();
				frame = requestAnimationFrame(animate);
			}
			function syncMotion() {
				cancelAnimationFrame(frame);
				lastTime = 0;
				root.dataset.paused = String(paused || document.hidden || reducedMotion.matches);
				draw();
				if (root.dataset.paused === "false") frame = requestAnimationFrame(animate);
			}
			function resize() {
				const rect = canvas.getBoundingClientRect();
				width = rect.width;
				height = rect.height;
				const ratio = Math.min(devicePixelRatio || 1, 2);
				canvas.width = Math.round(width * ratio);
				canvas.height = Math.round(height * ratio);
				ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
				draw();
			}
			function toggleTheme() {
				const light = root.dataset.theme !== "light";
				root.dataset.theme = light ? "light" : "dark";
				themeButton.setAttribute("aria-label", `Switch to ${light ? "dark" : "light"} theme`);
				ink = getComputedStyle(root).getPropertyValue("--foreground").trim();
				draw();
			}
			brandButtons.forEach((button) => {
				button.addEventListener("click", () => { brand = button.dataset.brand; render(); });
			});
			themeButton.addEventListener("click", toggleTheme);
			document.addEventListener("keydown", (event) => {
				if (event.ctrlKey || event.altKey || event.metaKey || event.shiftKey || event.target.isContentEditable || /INPUT|TEXTAREA|SELECT/.test(event.target.tagName)) return;
				if (event.key === "1" || event.key === "2") { brand = event.key === "1" ? "basalt" : "xray"; render(); }
				if (event.key.toLowerCase() === "t") toggleTheme();
				if (event.code === "Space" && event.target.tagName !== "BUTTON") { event.preventDefault(); paused = !paused; syncMotion(); }
			});
			window.addEventListener("resize", resize);
			document.addEventListener("visibilitychange", syncMotion);
			reducedMotion.addEventListener("change", syncMotion);
			ink = getComputedStyle(root).getPropertyValue("--foreground").trim();
			render();
			resize();
			syncMotion();
		</script>
	</body>
